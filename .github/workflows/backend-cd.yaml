name: Backend CD (GHCR + kind)

on:
  push:
    branches: [main]
    paths: ['starter/backend/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/backend:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: starter/backend
          load: true
          push: false
          tags: ${{ env.IMAGE }}

      - name: Push image to GHCR
        run: docker push "$IMAGE"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: cluster

      - name: Load image into kind
        run: kind load docker-image "$IMAGE" --name cluster

      - name: Deploy with kustomize
        working-directory: starter/backend/k8s
        run: |
          kustomize edit set image backend=$IMAGE
          kustomize build | kubectl apply -f -

      - name: Verify deployment
        run: |
          kubectl wait --for=condition=available deployment --all --timeout=180s
          kubectl get pods,svc -o wide

      - name: Smoke test /movies
        run: |
          kubectl port-forward deployment/backend 5000:5000 &
          sleep 5
          curl --fail http://localhost:5000/movies
