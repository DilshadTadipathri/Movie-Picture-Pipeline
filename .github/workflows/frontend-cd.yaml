name: Frontend CD (GHCR + kind)

on:
  push:
    branches: [main]
    paths: ['starter/frontend/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Backend URL baked into the frontend build. Set a repo variable to override.
  REACT_APP_MOVIE_API_URL: ${{ vars.REACT_APP_MOVIE_API_URL || 'http://localhost:5000' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/frontend:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: starter/frontend
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: |
            REACT_APP_MOVIE_API_URL=${{ env.REACT_APP_MOVIE_API_URL }}

      - name: Push image to GHCR
        run: docker push "$IMAGE"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: cluster

      - name: Load image into kind
        run: kind load docker-image "$IMAGE" --name cluster

      - name: Deploy with kustomize
        working-directory: starter/frontend/k8s
        run: |
          kustomize edit set image frontend=$IMAGE
          kustomize build | kubectl apply -f -

      - name: Verify deployment
        run: |
          kubectl wait --for=condition=available deployment --all --timeout=180s
          kubectl get pods,svc -o wide
